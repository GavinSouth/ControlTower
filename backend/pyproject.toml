[project]
name = "controltower"
version = "0.1.0"
description = "Backend for ControlTower: trip tracking API, database, and flight lookup."
readme = "README.md"
authors = [
    { name = "Gavin South", email = "gavinsouth@msn.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.159.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
controltower = "controltower:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, N naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# SQLAlchemy warnings flag real ORM mistakes (e.g. objects missing from the session).
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
